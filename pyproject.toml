[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "numpy>=1.24.0",
    # Available in the build env so PYWBGT_CYTHONIZE=1 can regenerate C from
    # .pyx; unused on the default path (which compiles the committed .c).
    # Major capped so C generation stays reproducible.
    "Cython>=3.0,<4.0",
]
build-backend = "setuptools.build_meta"

[project]
name        = "pywbgt"
version     = "3.0.7"
description = "Package for estimating wetbulb globe temperature using various algorithms"
readme      = "README.md"
authors     = [
    {name="Kyle R. Wodzicki", email="kwodzicki@cicsnc.org"},
]

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0",
    "numba",
    "metpy==1.6.3",
    "xarray>=2024.06",
    "pint>=0.24",
    "pandas>=2.0.0",
    "pvlib>=0.10.5",
]

# Shown on the PyPI project sidebar.
[project.urls]
Homepage   = "https://github.com/kwodzicki/pywbgt"
Repository = "https://github.com/kwodzicki/pywbgt"

[tool.setuptools.packages.find]
where = ["src"]

# Files bundled INTO the wheel. Includes Cython sources (.pyx), the generated
# C (.c), Cython declaration files (.pxd) and the hand-written C in src/.
[tool.setuptools.package-data]
"*" = ["**/*.pyx", "**/*.pxd", "**/*.c"]

# -----------------------------------------------------------------------------
# cibuildwheel: builds the binary wheels in CI (see .github/workflows).
#   * Build CPython 3.10-3.12; skip PyPy and musl-based Linux.
#   * Import-test each wheel so a broken build fails immediately.
#   * OpenMP: Linux manylinux images ship GCC+libgomp and Windows MSVC has
#     /openmp built in; only macOS needs libomp installed first.
# -----------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip  = "pp* *-musllinux*"
# No test-command here on purpose: importing pywbgt pulls in the full runtime
# stack (metpy->matplotlib->Pillow, pvlib->h5py), which tries to build from
# source and fails in the manylinux/Windows build environments (no HDF5/libjpeg
# system libs). Functional testing is handled by ci.yml on native runners,
# where those dependencies install as prebuilt wheels.
# Regenerate C from .pyx so published wheels always track the current sources.
environment = { PYWBGT_CYTHONIZE = "1" }

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
