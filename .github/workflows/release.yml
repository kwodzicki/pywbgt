# -----------------------------------------------------------------------------
# Build & publish pywbgt to PyPI
#
# WHAT THIS DOES
#   On every pushed tag matching "v*" (e.g. v3.0.6) this workflow:
#     1. verifies the tag matches the version in pyproject.toml
#     2. builds binary wheels for Linux, macOS and Windows (cibuildwheel)
#     3. builds the source distribution (sdist)
#     4. publishes both to PyPI using Trusted Publishing (OIDC) -- NO API TOKEN
#
# WHY IT ONLY RUNS ON TAGS
#   The `on:` block lists ONLY `push.tags`. There is no `branches`,
#   `pull_request`, or `workflow_dispatch` trigger, so nothing here runs on
#   ordinary commits -- only when a tag like `v3.0.6` is pushed.
#
# ONE-TIME SETUP (see PUBLISHING.md):
#   * Register a PyPI "pending publisher" for project `pywbgt` pointing at
#     owner=kwodzicki, repo=pywbgt, workflow=release.yml, environment=pypi.
#   * Create a GitHub Environment named `pypi` in the repo settings.
#
# RELEASING:
#   1. Bump `version` in pyproject.toml (must equal the tag without the "v").
#   2. git tag v3.0.6 && git push origin main --tags
# -----------------------------------------------------------------------------
name: Build and publish to PyPI

on:
  push:
    tags:
      - "v*"   # <-- ONLY tag pushes trigger this workflow

jobs:
  # ---------------------------------------------------------------------------
  # Fail fast if the git tag and pyproject.toml version disagree, so we never
  # publish a mislabeled release. Expects tag "vX.Y.Z" == version "X.Y.Z".
  # ---------------------------------------------------------------------------
  check_version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # needs tomllib (stdlib >= 3.11)

      - name: Compare tag to pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag  pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag ($tag) does not match pyproject.toml version ($proj)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Build platform-specific binary wheels on each OS via cibuildwheel.
  # cibuildwheel reads its config from [tool.cibuildwheel] in pyproject.toml.
  # ---------------------------------------------------------------------------
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    needs: check_version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (arm64). Intel macOS (macos-13) was retired
        # by GitHub in Dec 2025 and x86_64 macOS is sunset entirely in 2027, so
        # Intel/older-macOS users install from the sdist instead.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # Homebrew's libomp on macos-14 targets macOS 14.0, so the arm64
          # wheel must declare the same minimum or delocate refuses to bundle
          # it. Ignored on Linux/Windows.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-14' && '14.0' || '' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # Build the source distribution once (platform-independent).
  # ---------------------------------------------------------------------------
  build_sdist:
    name: Source distribution
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Collect every artifact and publish to PyPI via Trusted Publishing.
  # No secrets/tokens: `id-token: write` lets the runner mint a short-lived
  # OIDC credential that PyPI trusts because of the pending-publisher config.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi          # must match the PyPI publisher + GitHub env
    permissions:
      id-token: write          # required for OIDC Trusted Publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # flatten wheels-*/ and sdist/ into dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
